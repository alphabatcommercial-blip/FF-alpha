name: Build FS Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Check Java
        run: |
          java -version
          javac -version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Cython
        run: |
          python -m pip install "Cython<3"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade buildozer

      - name: Show Buildozer version
        run: |
          buildozer --version

      - name: Build Android APK
        run: |
          buildozer -v android debug

      - name: List APK files
        if: always()
        run: |
          echo "APK files:"
          find bin -type f -name "*.apk" -print || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FS-Manager-APK
          path: bin/*.apk
          if-no-files-found: error
